services:
  - type: web
    name: mithunkrishnaneuralecho-2
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: https://neuralecho1.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://neuralecho1.vercel.app,https://neuralecho.vercel.app,https://neural-echo.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PUBLIC_URL
        sync: false
